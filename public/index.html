<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>    <div class="container">
        <nav class="tab-nav">
            <a href="/">Home</a>
            <a href="/budget.html">Budget</a>
            <a href="/all-expenses.html">Expenses</a>
        </nav>

        <header>
            <h1>💰 Expense Tracker</h1>
        </header>

        <main>
            <form id="expense-form" class="expense-form">
                <div class="form-group">
                    <label for="amount">Amount ($)</label>
                    <input type="number" id="amount" name="amount" step="0.01" min="0" required>
                </div>                <div class="form-group">
                    <label for="is-positive">Type</label>
                    <div class="type-buttons">
                        <button type="button" id="expense-btn" class="type-btn active">
                            Expense
                        </button>
                        <button type="button" id="income-btn" class="type-btn">
                            Income
                        </button>
                    </div>
                    <input type="hidden" id="is-positive" name="is_positive" value="0">
                </div>

                <div class="form-group">
                    <div class="label-with-checkbox">
                        <label for="expense-date">Expense Date</label>
                        <label class="hold-checkbox-label">
                            <input type="checkbox" id="hold-date" name="hold_date">
                            <span>Hold</span>
                        </label>
                    </div>
                    <div class="date-container">
                        <button type="button" class="date-nav" onclick="changeDate(-1)">‹</button>
                        <input type="date" id="expense-date" name="expense_date" required>
                        <button type="button" class="date-nav" onclick="changeDate(1)">›</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <!-- Options are filled from categories.js -->
                    <select id="category" name="category" required></select>
                </div>

                <div class="form-group">
                    <label for="what">Description</label>
                    <div class="autocomplete-container">
                        <input type="text" id="what" name="what" required autocomplete="off">
                        <div id="what-suggestions" class="suggestions"></div>
                    </div>
                </div>                <div class="form-group" id="merchant-group">
                    <label for="merchant">Merchant</label>
                    <div class="autocomplete-container">
                        <input type="text" id="merchant" name="merchant" autocomplete="off">
                        <div id="merchant-suggestions" class="suggestions"></div>
                    </div>
                    <div id="merchant-chips" class="suggestion-chips"></div>
                </div>

                <div class="form-group" id="event-group">
                    <label for="event">Event <span class="field-hint">(optional)</span></label>
                    <div class="autocomplete-container">
                        <input type="text" id="event" name="event" autocomplete="off">
                        <div id="event-suggestions" class="suggestions"></div>
                    </div>
                </div>

                <div class="form-group" id="taxable-group" style="display: none;">
                    <label class="checkbox-label">
                        <input type="checkbox" id="is-taxable" name="is_taxable" value="1">
                        <span class="checkmark"></span>
                        Is taxable income
                    </label>
                </div>

                <button type="submit" class="submit-btn">Add Expense</button>
            </form>

            <div id="message" class="message"></div>            <section class="recent-expenses">
                <h2>Recent Expenses</h2>
                <div id="expenses-list" class="expenses-list">
                    <!-- Expenses will be loaded here -->
                </div>
                <div class="view-all-container">
                    <a href="all-expenses.html" class="view-all-btn">View All Expenses</a>
                </div>
            </section>
        </main>

        <div class="page-footer">
            <button onclick="logout()" class="logout-btn" title="Logout">🚪 Logout</button>
        </div>
    </div>

    <script src="categories.js"></script>
    <script src="auth.js"></script>
    <script src="script.js"></script>
</body>
</html>
