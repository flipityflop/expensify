<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget - Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .section-title {
            font-size: 1.1rem;
            color: #7dd3fc;
            margin: 28px 0 10px;
        }

        .section-note {
            color: #9ca3af;
            font-size: 0.85rem;
            margin: -6px 0 12px;
        }

        .goal-input {
            width: 100px;
            padding: 6px 8px;
            border: 2px solid #374151;
            border-radius: 6px;
            background-color: #111827;
            color: #e6e8eb;
            font-size: 0.9rem;
        }

        .goal-input:focus {
            outline: none;
            border-color: #67e8f9;
        }

        .under { color: #22c55e; font-weight: 600; }
        .over  { color: #ef4444; font-weight: 600; }

        /* Fixed rows read as "autofill will not touch this". */
        .fixed-row td:first-child::after {
            content: " 📌";
            font-size: 0.75rem;
        }

        .fixed-row { background: #171c28; }

        td input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #67e8f9;
        }

        .budget-progress-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
            color: #a8b3cf;
            font-size: 0.9rem;
        }

        #progress-figures { font-weight: 600; color: #e6e8eb; }

        /* .progress-bar / .progress-fill come from style.css (green gradient). */
        .progress-fill.over { background: linear-gradient(135deg, #ef4444, #dc2626); }

        .autofill-btn {
            margin-left: 8px;
            padding: 4px 10px;
            border: 1px solid #4b5563;
            border-radius: 6px;
            background: #374151;
            color: #e6e8eb;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .autofill-btn:hover { border-color: #67e8f9; color: #67e8f9; }
        .autofill-btn:disabled { opacity: 0.5; cursor: default; }

        tfoot td {
            font-weight: 700;
            border-top: 2px solid #2a3441;
        }
    </style>
</head>
<body>
    <div class="container full-width">
        <nav class="tab-nav">
            <a href="/">Home</a>
            <a href="/budget.html">Budget</a>
            <a href="/all-expenses.html">Expenses</a>
        </nav>

        <header class="flex">
            <h1>🎯 Budget</h1>
        </header>

        <div class="budget-progress">
            <div class="budget-progress-head">
                <span id="progress-label">Total spend</span>
                <span id="progress-figures">—</span>
            </div>
            <div class="progress-bar">
                <div id="budget-progress-fill" class="progress-fill"></div>
            </div>
        </div>

        <div class="filters">
            <div class="filter-group">
                <label for="month">Month:</label>
                <input type="month" id="month">
            </div>
            <div class="filter-group">
                <label for="spending-budget">Income to spend (monthly):</label>
                <input type="number" id="spending-budget" step="0.01" min="0" placeholder="e.g. 4000">
                <button type="button" id="autofill" class="autofill-btn"
                        title="Split the income above across the monthly categories, in proportion to what each has averaged per month. Leave the income blank to use the raw averages.">Autofill avg</button>
            </div>
        </div>

        <h2 class="section-title" id="monthly-heading">Monthly goals</h2>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Category</th>
                        <th>Goal</th>
                        <th>Actual</th>
                        <th>Difference</th>
                        <th>Set Goal</th>
                        <th title="A fixed cost. Autofill leaves it alone and sizes everything else around it.">Fixed</th>
                    </tr>
                </thead>
                <tbody id="budget-tbody"></tbody>
                <tfoot id="budget-tfoot"></tfoot>
            </table>
        </div>

        <h2 class="section-title" id="yearly-heading">Yearly goals</h2>
        <p class="section-note">Lumpy month to month, so these are set and tracked against the whole calendar year.</p>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Category</th>
                        <th>Goal</th>
                        <th>Actual</th>
                        <th>Difference</th>
                        <th>Set Goal</th>
                        <th title="A fixed cost. Autofill leaves it alone and sizes everything else around it.">Fixed</th>
                    </tr>
                </thead>
                <tbody id="yearly-tbody"></tbody>
            </table>
        </div>

        <div id="loading" class="loading">Loading budget...</div>

        <div class="page-footer">
            <button onclick="logout()" class="logout-btn" title="Logout">🚪 Logout</button>
        </div>
    </div>

    <script src="categories.js"></script>
    <script src="auth.js"></script>
    <script src="budget.js"></script>
</body>
</html>
