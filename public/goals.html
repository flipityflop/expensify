<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goals - Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Three tiles across even on a phone, where style.css would otherwise
           stack .summary into a column. */
        #goal-totals {
            flex-direction: row;
            gap: 10px;
        }

        #goal-totals .summary-item {
            min-width: 0;
            padding: 12px;
        }

        #goal-totals .summary-label { font-size: 0.8rem; }
        #goal-totals .summary-value { font-size: 1.1rem; }

        .over { color: #ef4444; font-weight: 600; }

        /* Said only when the monthly amounts do not fit the plan's savings. */
        .goal-plan {
            margin: -8px 0 16px;
            font-size: 0.9rem;
        }

        /* The rows read as the account rows on the Accounts page do. */
        .goal-row {
            background: #1a1f2e;
            border: 1px solid #2a3441;
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 10px;
        }

        .goal-row-head {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .goal-name { font-weight: 600; }

        .goal-figures {
            margin-left: auto;
            color: #a8b3cf;
            font-size: 0.9rem;
        }

        /* The bar fills as the money goes by, the opposite way round to the
           debt bars on the Accounts page. */
        .goal-row .progress-bar {
            height: 14px;
            margin-bottom: 0;
        }

        .goal-meta {
            margin-top: 8px;
            color: #9ca3af;
            font-size: 0.8rem;
        }

        .goal-monthly {
            color: #e6e8eb;
            font-weight: 600;
        }

        #add-goal-btn { margin: 4px 0 0; }
    </style>
</head>
<body>
    <div class="container full-width">
        <nav class="tab-nav">
            <a href="/">Home</a>
            <a href="/budget.html">Budget</a>
            <a href="/all-expenses.html">Expenses</a>
            <a href="/accounts.html">Accounts</a>
            <a href="/goals.html">Goals</a>
        </nav>

        <header class="flex">
            <h1>🏁 Goals</h1>
        </header>

        <div id="goal-totals" class="summary"></div>
        <p class="goal-plan" id="goal-plan"></p>

        <div class="section-head">
            <h2 class="section-title">Saving for</h2>
            <button type="button" id="put-by-btn" class="small-btn">Put by</button>
        </div>
        <div id="goal-list"><p class="empty-note">Loading goals...</p></div>
        <button type="button" id="add-goal-btn" class="small-btn">Add goal</button>

        <div id="goal-modal" class="modal" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 id="goal-modal-title">Add goal</h3>
                    <span class="close" data-close="goal-modal">&times;</span>
                </div>
                <div class="modal-body">
                    <div class="modal-field">
                        <label for="goal-name">Name</label>
                        <input type="text" id="goal-name">
                    </div>
                    <div class="modal-field">
                        <label for="goal-target">Goal amount</label>
                        <input type="number" id="goal-target" step="0.01" min="0">
                    </div>
                    <div class="modal-field">
                        <label for="goal-date">By</label>
                        <input type="date" id="goal-date">
                    </div>
                    <div class="modal-field">
                        <label for="goal-saved">Saved</label>
                        <input type="number" id="goal-saved" step="0.01" min="0" placeholder="0">
                    </div>
                    <div class="modal-field">
                        <label for="goal-notes">Notes</label>
                        <input type="text" id="goal-notes">
                    </div>
                    <div class="modal-actions">
                        <button type="button" id="goal-delete" class="cancel-btn danger-btn">Delete</button>
                        <button type="button" class="cancel-btn" data-close="goal-modal">Cancel</button>
                        <button type="button" id="goal-save" class="confirm-btn">Save</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="put-by-modal" class="modal" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Put by</h3>
                    <span class="close" data-close="put-by-modal">&times;</span>
                </div>
                <div class="modal-body">
                    <div class="modal-field">
                        <label for="put-by-goal">Goal</label>
                        <select id="put-by-goal"></select>
                    </div>
                    <div class="modal-field">
                        <label for="put-by-amount">Amount</label>
                        <input type="number" id="put-by-amount" step="0.01" min="0">
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="cancel-btn" data-close="put-by-modal">Cancel</button>
                        <button type="button" id="put-by-save" class="confirm-btn">Save</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="page-footer">
            <button onclick="logout()" class="logout-btn" title="Logout">🚪 Logout</button>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="helpers.js"></script>
    <script src="goals.js"></script>
</body>
</html>
